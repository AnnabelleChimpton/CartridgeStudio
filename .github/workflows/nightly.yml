# Nightly: the browser tests in all three browsers (including the @perf
# timing tests), npm audit, the bundle-size budget and, optionally, the MAME
# behaviour tests.

name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: toolchain/vendor
          key: toolchain-${{ hashFiles('toolchain/toolchain.lock.json', 'toolchain/scripts/**') }}
      - run: npm run setup
      - name: Install Playwright's ${{ matrix.browser }}
        working-directory: app
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests
        working-directory: app
        run: npx playwright test --project=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: app/test-results/
          retention-days: 14

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Reads package-lock.json; nothing needs installing.
      - run: npm audit

  bundle:
    name: Bundle-size budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: toolchain/vendor
          key: toolchain-${{ hashFiles('toolchain/toolchain.lock.json', 'toolchain/scripts/**') }}
      - run: npm run setup
      - run: npm run build
      - run: npm run budget

  # Optional: Ubuntu's packaged MAME (/usr/games/mame) is older than the 0.289
  # the harness was written against, though newer than the 0.254 it needs for
  # its Lua frame notifier. The job runs the suite with the stub BIOS (no
  # Atari BIOS is needed or used) and doesn't fail the nightly run.
  mame:
    name: MAME behaviour tests (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      MAME_PATH: /usr/games/mame
      MAME_BIOS: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install MAME
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mame
          "$MAME_PATH" -version
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: toolchain/vendor
          key: toolchain-${{ hashFiles('toolchain/toolchain.lock.json', 'toolchain/scripts/**') }}
      - run: npm run setup
      - name: MAME behaviour tests
        run: npm run test:mame -- --reporter=default --reporter=json --outputFile=mame-results.json
      # The suite skips itself when MAME can't be found; here that's a failure.
      - name: The tests ran rather than skipped
        run: node -e 'const r=require("./mame-results.json"); console.log(`${r.numPassedTests} passed, ${r.numPendingTests} skipped`); if (!r.numPassedTests) process.exit(1)'
